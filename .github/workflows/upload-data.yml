name: Upload Current Statistics
run-name: Current Statistics of Live are being Uploaded

on: 
  schedule:
    - cron: '10 * * * *'

jobs:
  UploadData:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
      - name: main command
        env:
          DBKEY: ${{ secrets.DBKEY }}
          DBURL: ${{ secrets.DBURL }}
          APIKEY: ${{ secrets.APIKEY }}
        run: DBKEY="$DBKEY" DBURL="$DBURL" APIKEY="$APIKEY" node ./updateTable/script.js